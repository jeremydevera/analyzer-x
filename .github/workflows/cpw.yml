name: Crypto-Predictor switch search
run-name: "Crypto-Predictor search · ${{ inputs.label }}"

# The operator, Oct 19, 2026: "use the strategy and switches and come up with
# best combination for all coins" — the seven entry rules of
# github.com/jeremydevera/Crypto-Predictor-Web (tradingagents/signals_cpw.py)
# with every combination of their main switches (528 settings), each measured
# like a Backtest v2 row (.github/scripts/cpw_shard.py -> sweep_shard.run_pair):
# "use the best combination and see what's setting will win", "One run first".
#
# Its own workflow, never sweep.yml: that file is at the ten-input limit, its
# claims and progress are namespaced by run id, and a research run must never
# write the market grid's pair-done markers or saved positions. Public market
# data only — no credentials are read. Dealt between both accounts by
# tradingagents/cpw_search.py (each account gets its own coin_list).

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      timeframes:
        description: "Comma-separated timeframes"
        default: "15m,30m,1h,4h,1d"
      coin_list:
        description: "Comma-separated symbols (BTC_USDT,ETH_USDT); empty = the whole market"
        default: ""
      days:
        description: "History window in days (Backtest v2's window)"
        default: "30"
      base:
        description: "Base margin $ per trade"
        default: "5"
      label:
        description: "A name for this run (its title)"
        default: "manual"

permissions:
  contents: write        # claims and progress on the sweep-progress branch
  actions: read

# THE EXCHANGE (Oct 10, 2026, the move to Gate): every script reads it
# through tradingagents.venue; the rows carry it, and the PC refuses a row
# measured on another exchange (cloud_sweep.land_rows).
env:
  TA_VENUE: gate

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  search:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad machine must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - name: Search shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          TFS: ${{ github.event.inputs.timeframes }}
          COIN_LIST: ${{ github.event.inputs.coin_list }}
          DAYS: ${{ github.event.inputs.days }}
          BASE_MARGIN: ${{ github.event.inputs.base }}
        run: python .github/scripts/cpw_shard.py

      # always(): a machine stopped at the time limit still hands over every
      # coin it finished — the files are rewritten after each coin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpw-rows-${{ matrix.shard }}
          path: out/rows-*.jsonl
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpw-summary-${{ matrix.shard }}
          path: |
            out/cpw-*.npz
            out/cpw-report-*.json
          if-no-files-found: warn
          retention-days: 30
