name: Sep 27 ML (decision trees)

# The operator, Sep 27, 2026: "instead of using confluence, can you review
# past 30 days and create best strategy for each coin and each timeframe use
# machine learning on what's best strategy i want tp higher than sl" — chose
# decision trees, learning from the 6 months before the last 30 days and
# testing on those 30 (tradingagents/ml_learner.py, ml_features.py,
# ml_trees.py).
#
# A SEPARATE workflow from sweep.yml and learn.yml on purpose: that file is
# at the ten-input limit, its progress and claims are namespaced by run id so
# no run shares a board, and this run must never write the market grid's
# pair-done markers or saved positions (sweep_shard.run_pair(learned=...)).
# The rows it produces are collected on the PC by
# tradingagents/learn_collect.py (--ml), which MERGES them into the v2 store
# without moving any pair's watermark.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      timeframes:
        description: "Comma-separated timeframes to learn"
        default: "15m,30m,1h,4h,1d"
      coin_list:
        description: "Comma-separated symbols (BTC_USDT,ETH_USDT); empty = the whole market"
        default: ""
      # NO `days` INPUT: ml_shard pins DAYS=30 (the learner's unseen window,
      # ml_learner.UNSEEN_DAYS) before sweep_shard reads it, so a box here
      # would change nothing while saying it did (Task 8 harddev, item b)
      base:
        description: "Base margin $ per trade"
        default: "5"

permissions:
  contents: write        # claims and progress on the sweep-progress branch
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  ml:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad machine must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - name: ML shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          TFS: ${{ github.event.inputs.timeframes }}
          COIN_LIST: ${{ github.event.inputs.coin_list }}
          BASE_MARGIN: ${{ github.event.inputs.base }}
        run: python .github/scripts/ml_shard.py

      # always(): a machine stopped at the time limit still hands over every
      # coin it finished — the files are rewritten after each coin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-rows-${{ matrix.shard }}
          path: out/rows-*.jsonl
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-models-${{ matrix.shard }}
          path: |
            out/formulas-*.json
            out/report-*.json
          if-no-files-found: warn
          retention-days: 30
