name: Watcher replay (what the watcher would have made)

# The operator, Sep 28, 2026: "Lets say i deployed this on sept 1 / What is my
# pnl overall / ... If there is no backtest yet then do backtest for aug",
# then "Then do the backtest replay so i know the pnl for every day to know if
# my plan has relevenave".
#
# Each machine walks every combination the strategy watcher could ever switch
# on (TP > SL, stop inside 80% of liquidation, cost under 20% of the target)
# from 30 days before START to now, on the frame's own candles, and writes
# only the ones that pass the watcher's on-rule at some daily check
# (.github/scripts/replay_shard.py). The PC replays the watcher over them day
# by day (tradingagents/watcher_replay.py, collected by
# tradingagents/replay_collect.py). Nothing here writes the market grid's
# rows, pair-done markers or saved positions.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      timeframes:
        description: "Comma-separated timeframes"
        default: "15m,30m,1h,4h,1d"
      coin_list:
        description: "Comma-separated symbols (BTC_USDT,ETH_USDT); empty = the whole market"
        default: ""
      start:
        description: "The first daily check, YYYY-MM-DD (its 30 days before are the first window)"
        default: "2026-09-01"
      base:
        description: "Base margin $ per trade"
        default: "5"
      groups:
        description: "Strategy groups: all, or any of classic,preset,sep25,sep27ml"
        default: "all"

permissions:
  contents: write        # claims and progress on the sweep-progress branch
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad machine must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - name: Replay shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          TFS: ${{ github.event.inputs.timeframes }}
          COIN_LIST: ${{ github.event.inputs.coin_list }}
          START: ${{ github.event.inputs.start }}
          BASE_MARGIN: ${{ github.event.inputs.base }}
          REPLAY_GROUPS: ${{ github.event.inputs.groups }}
          # the daily checks are the OPERATOR's midnights, not the runner's UTC
          TZ: America/New_York
        run: python .github/scripts/replay_shard.py

      # always(): a machine stopped at the time limit still hands over every
      # coin it finished — the files are rewritten after each coin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.shard }}
          path: |
            out/replay-*.jsonl
            out/replay-report-*.json
          if-no-files-found: warn
          retention-days: 30
