name: Watcher rules research (raw, split by coin)

# Operator, Sep 30, 2026: "show me the result for top 100 combinations so i
# can decide which to deploy" — over replay data too big for the PC. Each
# machine takes one replay shard (whole coins) from an earlier replay run,
# replays every raw rule set on it, and uploads its closed trades; the PC adds
# them up and scores them (.github/scripts/research_shard.py).

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "The replay run whose replay-<N> artifacts to research"
        required: true
      shards:
        description: "How many replay shards that run had"
        default: "20"
      end_ms:
        description: "The whole run's common end (epoch ms)"
        required: true
      scenarios:
        description: "Which rule-set grid: 5 = 144 raw (15|30 days x 50-90% x 10-50 trades x SL cap)"
        default: "5"

permissions:
  contents: read
  actions: read          # to download another run's artifacts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 -c "import json,os;print('shards='+json.dumps(list(range(int(os.environ['N'])))))" >> "$GITHUB_OUTPUT"
        env:
          N: ${{ github.event.inputs.shards }}

  research:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - uses: actions/download-artifact@v4
        with:
          name: replay-${{ matrix.shard }}
          path: src
          run-id: ${{ github.event.inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Research shard ${{ matrix.shard }}
        env:
          SRC: src
          SHARD: ${{ matrix.shard }}
          END_MS: ${{ github.event.inputs.end_ms }}
          SCEN: ${{ github.event.inputs.scenarios }}
          # the checks are the OPERATOR's midnights, as the replay's were
          TZ: America/New_York
        run: python .github/scripts/research_shard.py

      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.shard }}
          path: |
            out/research-*.npz
            out/research-*.json
          retention-days: 14
