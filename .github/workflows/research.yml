name: Watcher rules research (raw, split by coin)

# Operator, Sep 30, 2026: "show me the result for top 100 combinations so i
# can decide which to deploy" — over replay data too big for the PC. Each
# machine takes one replay shard (whole coins) from an earlier replay run,
# replays every raw rule set on it, and uploads its closed trades; the PC adds
# them up and scores them (.github/scripts/research_shard.py).

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "The replay run whose replay-<N> artifacts to research"
        required: true
      shards:
        description: "How many replay shards that run had"
        default: "20"
      end_ms:
        description: "The whole run's common end (epoch ms)"
        required: true
      scenarios:
        description: "Which rule-set grid: 5 = 144 raw; 6 = 8,064, every shape (needs replay write wr=40,trades=1,tp=any,windows=7|15|30); file:research/p4/<name>.json = a list (prompt 4's rounds)"
        default: "5"
      chunks:
        description: "Split the grid into this many slices, one job each per shard that holds coins, so no job passes six hours (grid 6: 8; shards x chunks must stay within 256)"
        default: "1"
      output:
        description: "full = every trade (the page's logs); daily = each rule set's day-by-day totals only (prompt 4's search rounds)"
        default: "full"
      source_repo:
        description: "The repo whose run holds the replay (blank = this one) — so the second account's 20 machines can research the first account's replay"
        default: ""

permissions:
  contents: read
  actions: read          # to download another run's artifacts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
      chunks: ${{ steps.mk.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      # ONLY THE SHARDS THAT HOLD COINS (Oct 02, 2026): the replay hands its
      # coins out first come, first served, so run 37007971331 put all 1,098
      # of them on 19 of its 40 machines and 21 uploaded ~600 bytes. A job on
      # an empty shard measures nothing, and GitHub refuses a matrix past 256
      # jobs — the slices a big round needs only fit without them.
      # .github/scripts/research_plan.py names every shard it leaves out.
      - id: mk
        run: python3 .github/scripts/research_plan.py >> "$GITHUB_OUTPUT"
        env:
          N: ${{ github.event.inputs.shards }}
          C: ${{ github.event.inputs.chunks }}
          SRC_RUN: ${{ github.event.inputs.source_run }}
          # the replay's own repo: the operator has two accounts, 20 machines
          # each (Oct 02, 2026: "dont i have 40 machines?"), and the replay's
          # artifacts live on the account that ran it
          REPO: ${{ github.event.inputs.source_repo || github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  research:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - uses: actions/download-artifact@v4
        with:
          name: replay-${{ matrix.shard }}
          path: src
          repository: ${{ github.event.inputs.source_repo || github.repository }}
          run-id: ${{ github.event.inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Research shard ${{ matrix.shard }}, slice ${{ matrix.chunk }}
        env:
          SRC: src
          SHARD: ${{ matrix.shard }}
          CHUNK: ${{ matrix.chunk }}
          CHUNKS: ${{ github.event.inputs.chunks }}
          OUT: ${{ github.event.inputs.output }}
          END_MS: ${{ github.event.inputs.end_ms }}
          SCEN: ${{ github.event.inputs.scenarios }}
          # the checks are the OPERATOR's midnights, as the replay's were
          TZ: America/New_York
        run: python .github/scripts/research_shard.py

      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.shard }}-${{ matrix.chunk }}
          path: |
            out/research-*.npz
            out/research-*.json
          retention-days: 14
