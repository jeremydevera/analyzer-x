name: All coins strategies - backtesting skill
run-name: "Skill backtest · ${{ inputs.label }}"

# The operator, Nov 05, 2026: "can you use these skills technical-analysis,
# backtesting-trading-strategies, backtesting-framework / use all my existing data from v2 , v3 and
# generate me the best strateigioes for all coins for all time frame". Every claimed coin's 15m, 30m,
# 1h, 4h and 1d candles through the backtesting-trading-strategies skill's own eight strategies
# (tradingagents/skill_bt.py, vendor/btstrat, MIT), chosen on the older 70% and judged on the newest
# 30% (.github/scripts/skill_shard.py). Public market data only. Dealt between every account by
# `python -m tradingagents.acs dispatch --skill`.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      coin_list:
        description: "Comma-separated coins (BTC,ETH); the plan's coins this account measures"
        default: ""
      label:
        description: "A name for this run (its title)"
        default: "manual"
      set:
        description: "bt = the backtesting skill's 8 strategies; ta = the technical-analysis and backtesting-frameworks skills' own (skill_ta.py), best 3 a coin-timeframe; ta_all = every one of their 42; daily = the 42 plus the backtesting skill's pinned picks, funding charged"
        default: "bt"

permissions:
  contents: write        # claims and progress on the sweep-progress branch
  actions: read

env:
  TA_VENUE: gate

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  measure:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad machine must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy

      - name: Skill backtest, shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          COIN_LIST: ${{ github.event.inputs.coin_list }}
          SKILL_SET: ${{ github.event.inputs.set }}
          DAYS: "30"
          BASE_MARGIN: "5"
        run: python .github/scripts/skill_shard.py

      # always(): a machine stopped at the time limit still hands over every coin it finished
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-lines-${{ matrix.shard }}
          path: |
            out/skill-*.jsonl
            out/skill-report-*.json
            out/skillta-*.jsonl
            out/skillta-report-*.json
            out/skilltaall-*.jsonl
            out/skilltaall-report-*.json
            out/skilldaily-*.jsonl
            out/skilldaily-report-*.json
          if-no-files-found: warn
          retention-days: 30
