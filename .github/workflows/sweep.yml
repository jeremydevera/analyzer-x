name: Market sweep (15m / 30m)

# Runs the whole-market backtest on GitHub's machines instead of the operator's
# laptop. It needs NO credentials: every input — candles, funding history, order
# books, fees, liquidation — is MEXC public data. Nothing secret is uploaded,
# and none of the repository's own key files are read.
#
# The work is embarrassingly parallel by coin, so it is sharded across runners.
# Each shard writes its rows as an artifact; `merge` stitches them together.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      coins:
        description: "Coins per shard (0 = all eligible in that shard)"
        default: "0"
      timeframes:
        description: "Comma-separated, e.g. 15m,30m"
        default: "15m,30m"
      min_days:
        description: "Minimum contract age in days"
        default: "365"

permissions:
  contents: write        # shards write their progress to the sweep-progress branch

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad shard must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Sweep shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          COINS: ${{ github.event.inputs.coins }}
          TFS: ${{ github.event.inputs.timeframes }}
          MIN_DAYS: ${{ github.event.inputs.min_days }}
        run: python .github/scripts/sweep_shard.py

      - uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.shard }}
          path: out/rows-*.jsonl
          if-no-files-found: warn
          retention-days: 14

  merge:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: rows-*
          merge-multiple: true
      - name: Stitch the shards
        run: |
          mkdir -p out
          # `cat` glues the last line of one shard to the first of the next
          # whenever a file lacks its trailing newline, and a runner killed at
          # the 6h ceiling can leave a half-written line. Either produced a
          # JSONDecodeError that binned an ENTIRE sweep: on 2026-08-24 all 21
          # shards succeeded (14 MB of rows) and the merge threw the lot away
          # at "line 1 column 105". Read line by line, skip what will not
          # parse, and SAY how many were skipped — a silent drop reads as
          # "that is all there was".
          for f in shards/rows-*.jsonl; do
            [ -s "$f" ] || continue
            cat "$f" >> out/rows-all.jsonl
            tail -c1 "$f" | read -r _ || echo >> out/rows-all.jsonl
          done
          python3 - <<'PY'
          import json, collections
          rows, bad = [], 0
          for line in open("out/rows-all.jsonl"):
              line = line.strip()
              if not line:
                  continue
              try:
                  rows.append(json.loads(line))
              except ValueError:
                  bad += 1
          if bad:
              print(f"!! {bad} unparseable line(s) skipped "
                    f"(truncated shard or a glued join)")
          coins = {r["coin"] for r in rows}
          def surv(r):
              return (r["profit"] > 0 and r["h1"] > 0 and r["h2"] > 0
                      and r["months"] and r["green"] / r["months"] >= .70
                      and r["gate"] != "block")
          sv = [r for r in rows if surv(r)]
          by = collections.Counter(r["signal"] for r in rows)
          print(f"{len(rows):,} PROFITABLE rows kept (losers and <100-trade "
                f"rows were never written) · {len(sv):,} survivors · "
                f"{len(coins)} coins · momentum thresholds capped to 1 of 3")
          for s, n in by.most_common(10):
              print(f"  {s:12} {n:6,}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-results
          path: out/rows-all.jsonl
          retention-days: 30
