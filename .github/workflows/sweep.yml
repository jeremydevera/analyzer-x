name: Market sweep (15m / 30m)

# Runs the whole-market backtest on GitHub's machines instead of the operator's
# laptop. It needs NO credentials: every input — candles, funding history, order
# books, fees, liquidation — is MEXC public data. Nothing secret is uploaded,
# and none of the repository's own key files are read.
#
# The work is embarrassingly parallel by coin, so it is sharded across runners.
# Each shard writes its rows as an artifact; `merge` stitches them together.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the work across"
        default: "20"
      coins:
        description: "Max coins one machine may claim (0 = keep claiming until the board is empty)"
        default: "0"
      timeframes:
        description: "Comma-separated, e.g. 15m,30m"
        default: "15m,30m"
      min_days:
        description: "Minimum contract age in days (0 = every contract; depth is each row's own days column)"
        default: "0"
      days:
        # 30, the same as cloud_sweep.SWEEP_DAYS. Operator, Sep 10, 2026: "i only
        # need past 30 days not 1 year because thats too much" — a default is a
        # window nobody chose, and 365 here was the last place still saying it.
        description: "History window in days (the Backtest screen's Previous N months; 30 = past month)"
        default: "30"
      base:
        description: "Base margin $ per trade — every dollar figure is measured at this stake"
        default: "5"
      mode:
        description: "full = every pair from scratch (BACKTEST); update = continue each pair with a saved position over its new bars only (UPDATE)"
        default: "full"
      state_runs:
        description: "Comma-separated run ids whose state-* artifacts hold the latest saved positions (update mode); empty = none"
        default: ""
      ingest_url:
        description: "Post each finished pair straight to this URL (the operator's PC, through a Cloudflare tunnel); empty = artifacts only"
        default: ""
      # WHICH coins, not how many. `coins` above is the per-machine cap and was
      # the ONLY thing the Backtest screen sent until Sep 10, 2026 — so picking
      # BTC measured whatever sat at the top of the shard's own alphabetical
      # board. NOTE: workflow_dispatch allows at most 10 inputs and this is the
      # tenth; anything further has to replace one, not be added.
      coin_list:
        description: "Comma-separated symbols to measure (BTC_USDT,ETH_USDT); empty = the whole market"
        default: ""

permissions:
  contents: write        # shards write their progress to the sweep-progress branch
  actions: read          # an UPDATE downloads earlier runs' state-* artifacts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["N"])
          print("shards=" + json.dumps(list(range(n))))
          PY
        env:
          N: ${{ github.event.inputs.shards }}

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # runners are killed at 6h; stop before that
    strategy:
      fail-fast: false            # one bad shard must not bin the others
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Sweep shard ${{ matrix.shard }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          COINS: ${{ github.event.inputs.coins }}
          TFS: ${{ github.event.inputs.timeframes }}
          MIN_DAYS: ${{ github.event.inputs.min_days }}
          DAYS: ${{ github.event.inputs.days }}
          BASE_MARGIN: ${{ github.event.inputs.base }}
          MODE: ${{ github.event.inputs.mode }}
          COIN_LIST: ${{ github.event.inputs.coin_list }}
          STATE_RUNS: ${{ github.event.inputs.state_runs }}
          # LIVE POSTING. The url is a one-run Cloudflare address the operator's
          # PC opened seconds before this run started; the token is a repository
          # secret, so it is masked in every log. A machine posts each pair the
          # moment it finishes AND still writes it to the artifact below — the
          # post is speed, the artifact is the guarantee.
          INGEST_URL: ${{ github.event.inputs.ingest_url }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python .github/scripts/sweep_shard.py

      - uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.shard }}
          path: out/rows-*.jsonl
          if-no-files-found: warn
          retention-days: 14

      # THE SAVED POSITIONS — one gzip'd file per pair this machine measured,
      # what the next UPDATE continues from. Kept longer than the rows: an
      # update a month later must still find them (cloud_sweep.STATE_RUN_MAX_AGE_S).
      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.shard }}
          path: out/state/*.json.gz
          if-no-files-found: warn
          retention-days: 90

  merge:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: rows-*
          merge-multiple: true
      - name: Summarise the shards
        run: |
          # THIS JOB NO LONGER CONCATENATES ANYTHING, and it no longer uploads.
          #
          # It used to build out/rows-all.jsonl and load every row into one
          # Python list. On 2026-08-25 that was 29,757,594 rows -- roughly 12 GB
          # of dicts on a 7 GB runner -- and the job was OOM-killed four minutes
          # in ("The runner has received a shutdown signal"). Because it died,
          # `sweep-results` was never written, and the collector on the operator's
          # Mac asked for that name and nothing else: it logged "ended with no
          # usable artifact", released the run, and 3.3 GB of correctly measured
          # rows sat in the twenty rows-N artifacts untouched while the store
          # stayed at 0.6%.
          #
          # The per-shard artifacts ARE the measurement. cloud_sweep.collect_
          # into_store streams them straight into the pair store, one pair at a
          # time, so a second copy is 3.3 GB of duplicate upload that buys
          # nothing and one more thing that can fail. This step now only counts,
          # and it counts WITHOUT holding a row: fixed memory whatever the size.
          python3 - <<'PY'
          import collections, glob, json
          rows = bad = surv = 0
          coins, by = set(), collections.Counter()
          for f in sorted(glob.glob("shards/rows-*.jsonl")):
              with open(f) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except ValueError:
                          bad += 1
                          continue
                      # a pair-done marker is bookkeeping, not a row — the
                      # shard writes one per measured pair (zero rows
                      # included) so the collect can see thin pairs; this
                      # counter died on the first one (KeyError: 'signal',
                      # run 34032725047)
                      if r.get("pair_done"):
                          continue
                      rows += 1
                      coins.add(r["coin"])
                      by[r["signal"]] += 1
                      if (r["profit"] > 0 and r["h1"] > 0 and r["h2"] > 0
                              and r["months"]
                              and r["green"] / r["months"] >= .70
                              and r["gate"] != "block"):
                          surv += 1
          if bad:
              print(f"!! {bad} unparseable line(s) skipped "
                    f"(truncated shard or a glued join)")
          print(f"{rows:,} PROFITABLE rows kept (losers and <100-trade rows "
                f"were never written) · {surv:,} survivors · {len(coins)} "
                f"coins · momentum thresholds capped to 1 of 3")
          for s, n in by.most_common(10):
              print(f"  {s:12} {n:6,}")
          print(f"\ncollect with: cloud_sweep.collect_into_store(<run id>) — "
                f"it reads the {len(glob.glob('shards/rows-*.jsonl'))} per-shard "
                f"artifacts directly, so this job writes none of its own")
          PY
