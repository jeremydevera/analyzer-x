[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.3.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
# The web API. Four test modules import it, and it was declared nowhere, so CI
# failed every run with `ModuleNotFoundError: No module named 'fastapi'` while
# the local venv had it installed by hand.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",          # starlette's TestClient needs it
    "pyarrow>=18.0",        # the parquet store the API reports on
]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
    "tradingagents[api]",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# `.claude/skills` holds agent tooling — one-off scrapers and probes, not code
# this project ships or imports. Linting it put 212 of 636 errors in the CI gate
# and none of them could affect the trader.
extend-exclude = ["results", "worklog", ".claude"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports
# Tests read fixture files inline, import late so monkeypatching lands before
# the module under test loads, and use short throwaway names. Those are how a
# test is written, not defects to carry into a CI gate — anything that can
# actually be WRONG (B023 loop-variable capture, F401 dead imports) is still
# enforced here and was fixed rather than silenced.
"tests/**" = ["SIM115", "SIM117", "SIM105", "SIM102", "SIM113",
              "E402", "E741", "E702", "E701"]
# app.py and spx_bot.py are the retired Streamlit screens. The UI they served
# now lives in webapp/; they are kept only until the last helper is ported, so
# reformatting them buys nothing and risks the parts still imported.
"app.py" = ["E402", "E741", "E702", "E701", "SIM115", "SIM117", "SIM105",
            "SIM102"]
# same Streamlit render path, same reason: the nested `if`s carry the comment
# explaining why the inner condition exists, and collapsing them loses it
"crypto_screener.py" = ["SIM102"]
"spx_bot.py" = ["E402", "E741", "E702", "E701", "SIM115", "SIM117"]

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
