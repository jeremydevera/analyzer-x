<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Coins Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--bg:#f6f7f5;--panel:#fff;--ink:#15191a;--ink2:#4b5355;--ink3:#7a8386;--rule:#dde2df;
 --accent:#0f6b62;--gain:#2a78d6;--loss:#e34948;--warn:#9a6300;
 --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111514;--panel:#181d1c;--ink:#eef2f0;
 --ink2:#b3bcb9;--ink3:#86908d;--rule:#2b3331;--accent:#4fb3a7;--gain:#3987e5;--loss:#e66767;--warn:#e0a53a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111514;--panel:#181d1c;--ink:#eef2f0;--ink2:#b3bcb9;--ink3:#86908d;
 --rule:#2b3331;--accent:#4fb3a7;--gain:#3987e5;--loss:#e66767;--warn:#e0a53a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
main{max-width:1400px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 6px}
.prov,.count,.note{color:var(--ink2);font-size:13px;margin:6px 0}.head{font-size:15px;margin:10px 0;max-width:110ch}
.warnbox{border-left:3px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;margin:12px 0}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2)}
input,select,button{font:13px var(--sans);padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=number]{width:96px}.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{cursor:pointer;font-size:12px;color:var(--ink2);position:sticky;top:0;background:var(--panel)}
td.l,th.l{text-align:left}.id{font-family:var(--mono)}.pos{color:var(--gain)}.neg{color:var(--loss)}.muted{color:var(--ink3);font-style:italic}
tr.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);cursor:pointer}
dialog{max-width:min(1100px,100vw - 32px);width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--panel);color:var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}.total{font-size:18px}.pager{display:flex;gap:8px;align-items:center;margin:8px 0}
</style></head><body><main>
<h1 id="h">Strategies for every coin and every timeframe</h1>
<p class="prov" id="prov">Opening the data...</p>
<p class="head warnbox" id="head"></p>
<div class="filters">
 <label>Base $ a trade<input id="f-base" type="number" min="0.5" step="0.5"></label>
 <label>Source<select id="f-src"><option value="">all</option></select></label>
 <label>Timeframe<select id="f-tf"><option value="">all</option><option>15m</option><option>30m</option><option>1h</option><option>4h</option><option>1d</option></select></label>
 <label>Held up<select id="f-held"><option value="">all rows</option><option value="new">made money on the days it was NOT chosen on (v2, skill)</option><option value="both">v3: profitable in both years</option><option value="prof">made money in its window</option><option value="best">BEST for each coin-timeframe (one each)</option><option value="fwd">FORWARD-TESTED: profitable in 2025 and chosen again for 2026 (v3)</option></select></label>
 <label>Min win %<input id="f-wr" type="number" min="0" max="100" placeholder="any"></label>
 <label>Min win ÷ loss size<input id="f-ratio" type="number" min="0" step="0.1" placeholder="any"></label>
 <label>Min profit $<input id="f-pr" type="number" step="1" placeholder="any"></label>
 <label>Min trades<input id="f-nt" type="number" min="0" step="1" placeholder="any"></label>
 <label>Min checks passed (of 7)<input id="f-cn" type="number" min="0" max="7" step="1" placeholder="any"></label>
 <label>Min months green<input id="f-gm" type="number" min="0" step="1" placeholder="any"></label>
 <label>Max worst dip $<input id="f-dd" type="number" min="0" step="1" placeholder="any"></label>
 <label>Max TP %<input id="f-tp" type="number" min="0" step="0.1" placeholder="any"></label>
 <label>Max SL %<input id="f-sl" type="number" min="0" step="0.1" placeholder="any"></label>
 <label>Last N days<input id="f-days" type="number" min="1" step="1" placeholder="whole window"></label>
 <label>Coin<input id="f-coin" type="text" placeholder="any"></label>
 <label>Find by ID<input id="f-id" type="text" placeholder="#XXXXXXXX"></label>
 <label>&nbsp;<button id="clear">Clear all filters</button></label>
</div>
<p class="count" id="count"></p>
<div class="pager"><button id="p-prev">Previous 100</button><span id="p-at"></span><button id="p-next">Next 100</button></div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="note" id="notes"></div>
<p class="note" id="legend"></p>
</main>
<dialog id="dlg"><div id="dlg-body"></div><p><button id="dlg-close">Close</button></p></dialog>
<script>
const Z="";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtWhen(ms){const d=new Date(ms);let h=d.getHours();const ap=h<12?"am":"pm";h=h%12||12;
 return `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}, ${d.getFullYear()} ${h}:${String(d.getMinutes()).padStart(2,"0")}${ap}`}
const usd=v=>"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>v==null?"":(v>0?"+":"")+(v<0?"-":"")+usd(v);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>v==null?"":v.toFixed(2)+"%";
const rng=(lo,hi)=>lo==null||hi==null?"":(Math.abs(hi-lo)<1e-9?pct(hi):pct(lo)+" to "+pct(hi));
const num=s=>{const v=parseFloat(s);return Number.isFinite(v)?v:null};
function monthKey(s){const d=new Date(s*1000);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
const PAGE=100,LOG_PAGE=100,DAY=86400;
let D=null,ROWS=[];
const state={base:5,f:{},src:"",tf:"",held:"",days:null,coin:"",id:"",opened:"",cur:-1,log:0,page:0,sort:{k:"profit",dir:-1}};
const idKey=()=>state.id.replace(/^#/,"").toUpperCase();
function rowsOf(D){return D.R.map((a,i)=>{const r={i};D.F.forEach((f,j)=>r[f]=a[j]);r.t=D.T[i];return r})}
// one row over its trades that CLOSED in the last N days of ITS OWN window (null = the whole window), dollars x k
function measure(r,days,k){
 const from=days?r.end-days*DAY:null;const t=from==null?r.t:r.t.filter(x=>x[1]>=from);
 let profit=0,wins=0,winSum=0,lossSum=0,run=0,runN=0,worst=0,worstN=0,noStop=false,noTgt=false,sLo=null,sHi=null,gLo=null,gHi=null,newP=0,newN=0;const months={};
 const newFrom=r.split!=null?r.split:r.end-15*DAY;
 for(const x of t){const p=x[4]/1e4*k;profit+=p;
  if(p>0){wins++;winSum+=p;run=0;runN=0}else{lossSum-=p;run+=p;runN++;if(run<worst){worst=run;worstN=runN}}
  const m=monthKey(x[1]);months[m]=(months[m]||0)+p;if(x[1]>=newFrom){newP+=p;newN++}
  if(x[5]>=0){const v=x[5]/1e3;sLo=sLo==null?v:Math.min(sLo,v);sHi=sHi==null?v:Math.max(sHi,v)}else noStop=true;
  if(x[6]>=0){const v=x[6]/1e3;gLo=gLo==null?v:Math.min(gLo,v);gHi=gHi==null?v:Math.max(gHi,v)}else noTgt=true}
 const n=t.length,losses=n-wins,aw=wins?winSum/wins:null,al=losses?lossSum/losses:null;
 const span=Math.max(1/24,days?Math.min(days,r.days):r.days);
 // backtesting-trading-strategies' metrics, from the trades: Sharpe and Sortino a year (trade returns x the
 // trades a year), the deepest fall of the running total, profit factor
 let eq=0,peak=0,mdd=0,sq=0,dsq=0;const mean=n?profit/n:0;
 for(const x of t){const p=x[4]/1e4*k;eq+=p;if(eq>peak)peak=eq;if(eq-peak<mdd)mdd=eq-peak;sq+=(p-mean)**2;if(p<0)dsq+=p*p}
 const perYear=n/span*365,sd=n>1?Math.sqrt(sq/(n-1)):0,dd=n?Math.sqrt(dsq/n):0;
 const sharpe=sd>0?mean/sd*Math.sqrt(perYear):null,sortino=dd>0?mean/dd*Math.sqrt(perYear):null;
 const pf=lossSum>0?winSum/lossSum:null;
 return {trades:n,wins,losses,win:n?wins/n*100:null,profit:n?profit:null,per:n?profit/n:null,avgWin:aw,avgLoss:al,
  ratio:aw!=null&&al?aw/al:null,worst:worstN?worst:0,worstN,months,green:n?Object.values(months).filter(v=>v>0).length:null,
  nmonths:Object.keys(months).length,stop:n&&!noStop?sHi:null,stopLeast:n&&!noStop?sLo:null,target:n&&!noTgt?gHi:null,
  targetLeast:n&&!noTgt?gLo:null,newP:newN?newP:null,newN,span,t,sharpe,sortino,mdd:n?mdd:null,pf,
  allStops:n>0&&!noStop}}
// backtesting-frameworks' Monte Carlo: the row's own trades drawn again with replacement, MC_RUNS times (seeded,
// so a reload gives the same number) - the share of draws that end in profit. Whole window, every row.
const MC_RUNS=200;
function monteCarlo(t){const n=t.length;if(n<2)return null;let s=(t[0][0]^t[n-1][1]^n)>>>0||1,ok=0;
 const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
 for(let i=0;i<MC_RUNS;i++){let sum=0;for(let j=0;j<n;j++)sum+=t[(rnd()*n)|0][4];if(sum>0)ok++}return ok/MC_RUNS}
// the checks the three skills ask of every strategy, each yes or no
const NEXT_TF={"15m":"30m","30m":"1h","1h":"4h","4h":"1d"};
const CHECKS=[["sample","30+ trades (technical-analysis: sample size)"],["stop","a stop on every trade (technical-analysis)"],
 ["unseen","made money on days it was not chosen on (out-of-sample)"],["rr","a win at least as big as a loss (risk/reward)"],
 ["pf","profit factor 1.2+ (backtesting-trading-strategies)"],["mc","80%+ of Monte Carlo draws end in profit (backtesting-frameworks)"],
 ["htf","the next bigger timeframe of the coin also made money (multiple-timeframe agreement)"]];
function checksOf(x,htf){const m=x.m,r=x.r;
 const unseen=r.split!=null?(m.newP!=null&&m.newP>0):(m.profit!=null&&m.profit>0);
 return {sample:m.trades>=30,stop:m.allStops,unseen,rr:m.ratio!=null&&m.ratio>=1,pf:m.pf!=null&&m.pf>=1.2,mc:r.mc!=null&&r.mc>=0.8,
  htf:NEXT_TF[r.tf]?!!htf[r.src+"|"+r.coin+"|"+NEXT_TF[r.tf]]:false}}
function fails(r,m,f){const out=[];
 if(f.wr!=null&&!(m.win!=null&&m.win>=f.wr))out.push("min win %");
 if(f.ratio!=null&&!(m.ratio!=null&&m.ratio>=f.ratio))out.push("min win ÷ loss size");
 if(f.pr!=null&&!(m.profit!=null&&m.profit>=f.pr))out.push("min profit $");
 if(f.nt!=null&&!(m.trades>=f.nt))out.push("min trades");
 if(f.gm!=null&&!(m.green!=null&&m.green>=f.gm))out.push("min months green");
 if(f.dd!=null&&!(m.trades>0&&-m.worst<=f.dd))out.push("max worst dip $");
 if(f.tp!=null&&!(m.target!=null&&m.target<=f.tp))out.push("max TP %");
 if(f.sl!=null&&!(m.stop!=null&&m.stop<=f.sl))out.push("max SL %");
 return out}
const LIMITS={wr:"min win %",ratio:"min win ÷ loss size",pr:"min profit $",nt:"min trades",gm:"min months green",dd:"max worst dip $",tp:"max TP %",sl:"max SL %"};
function heldOk(r,m){if(state.held==="new")return r.split!=null&&m.newP!=null&&m.newP>0;
 if(state.held==="both")return r.both===1;if(state.held==="prof")return m.profit!=null&&m.profit>0;if(state.held==="best")return r.best===1;if(state.held==="fwd")return r.fwd===1;return true}
function filterNames(){const f=state.f,w={wr:v=>`win at least ${v}%`,ratio:v=>`a win at least ${v}x a loss`,pr:v=>`profit at least ${money(v)}`,
 nt:v=>`${v}+ trades`,gm:v=>`${v} or more months green`,dd:v=>`worst dip no worse than −${usd(v)}`,tp:v=>`target at most ${v}% on every trade`,sl:v=>`stop at most ${v}% on every trade`};
 const out=Object.keys(w).filter(k=>f[k]!=null).map(k=>w[k](f[k]));if(f.cn!=null)out.push(`${f.cn}+ of the 7 checks passed`);
 if(state.src)out.unshift(`source ${state.src}`);if(state.tf)out.unshift(`timeframe ${state.tf}`);
 if(state.held)out.push({fwd:"forward-tested: profitable in 2025 and chosen again for 2026",best:"BEST for each coin-timeframe",new:"made money on the days it was not chosen on",both:"v3 profitable in both years",prof:"made money in its window"}[state.held]);
 if(state.coin)out.push(`coin contains "${state.coin}"`);return out}
// the BEST strategy of every coin-timeframe, chosen on its OLDER days only (never on the days it is
// then judged on): the most of the skills' checks passed on those trades - profit, a win at least a loss,
// profit factor 1.2+, 80%+ of Monte Carlo draws in profit, a stop on every trade, 10+ trades - then the
// most money a trade there. v2 and skill rows only: a v3 row's window is all unseen days.
function markBest(){const best={};
 for(const r of ROWS){if(r.split==null)continue;const t=r.t.filter(x=>x[0]<r.split);if(!t.length)continue;
  let p=0,w=0,ws=0,ls=0,stops=true;for(const x of t){const v=x[4]/1e4;p+=v;if(v>0){w++;ws+=v}else ls-=v;if(x[5]<0)stops=false}
  const n=t.length,aw=w?ws/w:null,al=n-w?ls/(n-w):null,mc=monteCarlo(t);
  const cn=[p>0,aw!=null&&al?aw/al>=1:false,ls>0?ws/ls>=1.2:ws>0,mc!=null&&mc>=0.8,stops,n>=10].filter(Boolean).length;
  const x={r,cn,per:p/n},key=r.coin+"|"+r.tf,b=best[key];
  if(!b||cn>b.cn||(cn===b.cn&&x.per>b.per))best[key]=x}
 for(const x of Object.values(best))x.r.best=1;return Object.keys(best).length}
function view(){const k=state.base/D.base;const rows=ROWS.map(r=>({r,m:measure(r,state.days,k)}));
 const htf={};for(const x of rows)if(x.m.profit!=null&&x.m.profit>0)htf[x.r.src+"|"+x.r.coin+"|"+x.r.tf]=1;
 for(const x of rows){x.c=checksOf(x,htf);x.cn=Object.values(x.c).filter(Boolean).length}
 const id=idKey(),coin=state.coin.toUpperCase();let shown;
 if(id)shown=rows.filter(x=>x.r.id===id);
 else shown=rows.filter(x=>(!state.src||x.r.src===state.src)&&(!state.tf||x.r.tf===state.tf)&&heldOk(x.r,x.m)
  &&!fails(x.r,x.m,state.f).length&&(state.f.cn==null||x.cn>=state.f.cn)&&(!coin||x.r.coin.toUpperCase().includes(coin)));
 const ms=new Set();for(const x of shown)for(const key of Object.keys(x.m.months))ms.add(key);
 return {rows,shown,months:[...ms].sort(),k}}
function sortVal(x,c){const m=x.m,r=x.r,t=m.trades;
 const v={profit:m.profit,tp:m.target,sl:m.stop,trades:t||null,perday:t?t/m.span:null,wins:t?m.wins:null,losses:t?m.losses:null,win:m.win,
  avgwin:m.avgWin,avgloss:m.avgLoss,ratio:m.ratio,worst:t?m.worst:null,green:m.green,per:m.per,newp:m.newP,bar:r.bar,wlday:t?m.wins/m.span:null,both:r.both,
  sharpe:m.sharpe,sortino:m.sortino,mdd:m.mdd,pf:m.pf,mc:r.mc,cn:x.cn,lost:r.lost,best:r.best||0,fwd:r.fwd||0};
 return c in v?v[c]:String(r[c]??"")}
function sortRows(xs,k,dir){return [...xs].sort((a,b)=>{const p=sortVal(a,k),q=sortVal(b,k);if(p==null&&q==null)return 0;if(p==null)return 1;if(q==null)return -1;
 return (typeof p==="number"&&typeof q==="number"?p-q:String(p).localeCompare(String(q)))*dir})}
const COLS=[["id","ID",1],["src","Source",1],["coin","Coin",1],["tf","Timeframe",1],["strategy","Strategy",1],["profit","PROFIT (total $)"],
 ["tp_rule","TP (target rule)",1],["tp","TP % (every trade)"],["sl_rule","SL (stop rule)",1],["sl","SL % (every trade)"],["lev","Leverage",1],
 ["trades","Trades"],["perday","Trades a day"],["wins","W"],["losses","L"],["wlday","W / L a day"],["win","Win %"],["avgwin","Avg win $"],["avgloss","Avg loss $"],
 ["ratio","Win size ÷ loss size"],["worst","Worst losing run"],["green","Months green"],["per","$ a trade"],
 ["newp","Days it was NOT chosen on $ (v2: newest 15 days · skill: newest 30%)"],["bar","Luck bar (v2 and skill: average setting $ a trade on those days · v3: random median $)"],["both","v3: profitable both years"],
 ["cn","Checks passed (of 7)"],["sharpe","Sharpe (a year)"],["sortino","Sortino (a year)"],["mdd","Max drawdown $"],["pf","Profit factor"],
 ["mc","Monte Carlo: draws in profit"],["lost","Lost on the older days (v2, skill)"],["best","BEST for its coin-timeframe"],["fwd","Forward-tested (won 2025, chosen again 2026)"]];
function cellOf(x,c,k){const r=x.r,m=x.m,none='<span class="muted">no trade in this window</span>';
 switch(c){case"id":return `<span class="id">#${esc(r.id)}</span>`;case"src":case"coin":case"tf":case"strategy":case"tp_rule":case"sl_rule":case"lev":return esc(r[c]);
  case"profit":return m.trades?`<b class="${m.profit>0?"pos":"neg"}">${money(m.profit)}</b>`:none;
  case"tp":return m.target!=null?rng(m.targetLeast,m.target):(m.trades?`<span class="muted">none (${r.src==="skill"?"exits on its own signal":"trailing stop"})</span>`:none);
  case"sl":return m.stop!=null?rng(m.stopLeast,m.stop):none;
  case"trades":return m.trades||none;case"perday":return m.trades?(m.trades/m.span).toFixed(2):none;
  case"wins":return m.trades?m.wins:none;case"losses":return m.trades?m.losses:none;
  case"wlday":return m.trades?`${(m.wins/m.span).toFixed(2)} / ${(m.losses/m.span).toFixed(2)}`:none;
  case"win":return m.win!=null?m.win.toFixed(1)+"%":none;case"avgwin":return m.avgWin!=null?money(m.avgWin):(m.trades?"no win":none);
  case"avgloss":return m.avgLoss!=null?money(-m.avgLoss):(m.trades?"no loss":none);
  case"ratio":return m.ratio!=null?m.ratio.toFixed(2)+"x":(m.trades?(m.avgLoss?"no win":"no loss"):none);
  case"worst":return m.trades?(m.worstN?`${money(m.worst)} over ${m.worstN}`:"no losses"):none;
  case"green":return m.trades?`${m.green}/${m.nmonths}`:none;case"per":return m.trades?money(m.per):none;
  case"newp":return r.split==null?'<span class="muted">its whole window is unseen days</span>':(m.newN?`<span class="${m.newP>0?"pos":"neg"}">${money(m.newP)}</span> over ${m.newN}`:"no trade");
  case"bar":return r.bar==null?'<span class="muted">none</span>':money(r.bar*k)+(r.split!=null?" a trade":"");
  case"both":return r.both==null?'<span class="muted">one year only</span>':(r.both?'<b class="pos">yes</b>':"no");
  case"cn":return `<b>${x.cn}</b>/7`;case"sharpe":return m.sharpe==null?none:m.sharpe.toFixed(2);case"sortino":return m.sortino==null?none:m.sortino.toFixed(2);
  case"mdd":return m.trades?money(m.mdd):none;case"pf":return m.pf==null?(m.trades?"no loss":none):m.pf.toFixed(2);
  case"mc":return r.mc==null?'<span class="muted">under 2 trades</span>':(r.mc*100).toFixed(0)+"%";
  case"best":return r.best?'<b class="pos">BEST</b>':"";
  case"fwd":return r.fwd?'<b class="pos">FORWARD-TESTED</b>':"";
  case"lost":return r.split==null?"":(r.lost===2?'<b class="neg">too new to check</b>':r.lost?'<b class="neg">yes</b> (filler)':"no")}}
function render(){const v=view(),s=state.sort;const sorted=sortRows(v.shown,s.k,s.dir);
 const pages=Math.max(1,Math.ceil(sorted.length/PAGE));state.page=Math.min(Math.max(state.page,0),pages-1);
 const a=state.page*PAGE,page=sorted.slice(a,a+PAGE);
 $("thead").innerHTML="<tr>"+COLS.map(([c,l,left])=>`<th data-k="${c}" class="${left?"l":""}">${esc(l)}${s.k===c?(s.dir>0?" ▲":" ▼"):""}</th>`).join("")
  +v.months.map(m=>`<th>${MON[+m.slice(5)-1]} ${m.slice(0,4)} $</th>`).join("")+"</tr>";
 $("tbody").innerHTML=page.map(x=>`<tr class="row" data-i="${x.r.i}">`+COLS.map(([c,_l,left])=>`<td class="${left?"l":""}">${cellOf(x,c,v.k)}</td>`).join("")
  +v.months.map(m=>{const p=x.m.months[m];return `<td class="${p>0?"pos":p<0?"neg":""}">${p==null?'<span class="muted">no trade</span>':money(p)}</td>`}).join("")+"</tr>").join("");
 $("p-at").textContent=`rows ${sorted.length?a+1:0}-${a+page.length} of ${sorted.length.toLocaleString()} (page ${state.page+1} of ${pages})`;
 $("p-prev").disabled=!state.page;$("p-next").disabled=state.page>=pages-1;
 const names=filterNames(),id=idKey();
 const idle=Object.keys(LIMITS).filter(key=>state.f[key]!=null&&v.rows.every(x=>!fails(x.r,x.m,{[key]:state.f[key]}).length)).map(key=>`${LIMITS[key]} cuts nothing here: every row already meets it`);
 const pairs=new Set(v.shown.map(x=>x.r.coin+"|"+x.r.tf)).size,coins=new Set(v.shown.map(x=>x.r.coin)).size;
 const v2n=v.shown.filter(x=>x.r.src==="v2"),held=v2n.filter(x=>x.m.newP!=null&&x.m.newP>0).length;
 $("count").innerHTML=`<b>${v.shown.length.toLocaleString()}</b> of ${ROWS.length.toLocaleString()} strategies, on ${coins.toLocaleString()} coins and ${pairs.toLocaleString()} coin-timeframes`
  +(id?(v.shown.length?" · found by ID (the other filters are off)":` · no strategy has #${esc(id)} (the other filters are off)`):"")
  +(names.length&&!id?" · "+esc(names.join(" AND ")):"")
  +(v2n.length?` · of the ${v2n.length.toLocaleString()} v2 shown, ${held.toLocaleString()} made money on the newest 15 days`:"")
  +(()=>{const w={};for(const x of v.shown){const e=x.r.end,s=e-(state.days?Math.min(state.days,x.r.days):x.r.days)*DAY;const o=w[x.r.src]||(w[x.r.src]={s,e});o.s=Math.min(o.s,s);o.e=Math.max(o.e,e)}
   return Object.keys(w).length?" · windows "+Object.entries(w).map(([k,o])=>`${esc(k)} ${fmtWhen(o.s*1000)} to ${fmtWhen(o.e*1000)}`).join("; "):""})()
  +(state.days?` · last ${state.days} days of each row's own window (every row re-added from its trades that closed in it: no minutes ride in a page, so it is not a new walk)`:"")
  +` · at ${usd(state.base)} a trade`+(state.base!==D.base?` (scaled from the ${usd(D.base)} measured)`:"")+(idle.length?" · "+esc(idle.join("; ")):"");
 document.querySelectorAll("#thead th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;state.sort={k,dir:state.sort.k===k?-state.sort.dir:-1};state.page=0;render()});
 document.querySelectorAll("#tbody tr").forEach(tr=>tr.onclick=()=>open(+tr.dataset.i))}
function open(i){state.cur=i;state.log=0;drawLog(true)}
function drawLog(show){const k=state.base/D.base,r=ROWS[state.cur];if(!r)return;const m=measure(r,state.days,k);
 const pages=Math.max(1,Math.ceil(m.t.length/LOG_PAGE));state.log=Math.min(Math.max(state.log,0),pages-1);
 const a=state.log*LOG_PAGE,b=Math.min(m.t.length,a+LOG_PAGE);let run=0;for(let i=0;i<a;i++)run+=m.t[i][4]/1e4*k;
 $("dlg-body").innerHTML=`<h3><span class="id">#${esc(r.id)}</span> ${esc(r.coin)} ${esc(r.tf)} ${esc(r.strategy)} · ${esc(r.src)}</h3>
 <div class="sum"><span>TOTAL PROFIT <b class="total ${m.profit>0?"pos":"neg"}">${m.trades?money(m.profit):"$0.00"}</b></span>
 <span>${m.trades} trades · ${m.wins} won · ${m.losses} lost${m.win!=null?" · "+m.win.toFixed(1)+"%":""}</span>
 <span>a win ${m.avgWin!=null?money(m.avgWin):"-"} · a loss ${m.avgLoss!=null?money(-m.avgLoss):"-"}${m.ratio!=null?` · ${m.ratio.toFixed(2)}x`:""}</span>
 <span>worst losing run <b>${m.worstN?`${money(m.worst)} over ${m.worstN}`:"none"}</b></span></div>
 <p class="note"><b>Checks</b> (the three skills' own tests, this window): ${(()=>{const v=view(),x=v.rows.find(y=>y.r.i===r.i);return CHECKS.map(([key,label])=>`${x.c[key]?"✓":"✗"} ${esc(label)}`).join(" · ")})()} · Sharpe ${m.sharpe==null?"-":m.sharpe.toFixed(2)}, Sortino ${m.sortino==null?"-":m.sortino.toFixed(2)}, max drawdown ${m.trades?money(m.mdd):"-"}, profit factor ${m.pf==null?"-":m.pf.toFixed(2)}, Monte Carlo ${r.mc==null?"-":(r.mc*100).toFixed(0)+"% of "+MC_RUNS+" draws in profit (whole window)"}.</p>
 <p class="note">Chosen on: ${esc(r.chosen_on)}. Check: ${esc(r.check)}. Target: ${esc(r.tp_rule)}. Stop: ${esc(r.sl_rule)}. Leverage ${esc(r.lev)}. ${r.src==="v2"?`Margin ${usd(state.base)} at 20x = ${usd(state.base*20)} of coin a trade.`:`Risk ${usd(state.base)} to the stop a trade, at the leverage shown.`} Window ends ${fmtWhen(r.end*1000)} (${r.days.toFixed(0)} days). ${m.trades?`${(m.wins/m.span).toFixed(2)} won and ${(m.losses/m.span).toFixed(2)} lost a day.`:""}</p>
 <p class="note">Trades ${m.t.length?a+1:0}-${b} of ${m.t.length} <button id="log-prev"${state.log?"":" disabled"}>Previous ${LOG_PAGE}</button> <button id="log-next"${state.log<pages-1?"":" disabled"}>Next ${LOG_PAGE}</button> (the total above is every trade, not this page)</p>
 <div class="wrap"><table><thead><tr><th class="l">#</th><th class="l">Side</th><th class="l">In</th><th class="l">Out</th><th class="l">Exit</th><th>SL %</th><th>TP %</th><th>Profit</th><th>Running</th></tr></thead><tbody>
 ${m.t.slice(a,b).map((t,j)=>{const p=t[4]/1e4*k;run+=p;return `<tr><td class="l">${a+j+1}</td><td class="l">${t[2]>0?"long":"short"}</td><td class="l">${fmtWhen(t[0]*1000)}</td><td class="l">${fmtWhen(t[1]*1000)}</td><td class="l">${esc(D.whys[t[3]])}</td><td>${t[5]>=0?pct(t[5]/1e3):""}</td><td>${t[6]>=0?pct(t[6]/1e3):"none"}</td><td class="${p>0?"pos":"neg"}">${money(p)}</td><td>${money(run)}</td></tr>`}).join("")}
 </tbody></table></div>`;
 $("log-prev").onclick=()=>{state.log--;drawLog(false)};$("log-next").onclick=()=>{state.log++;drawLog(false)};
 if(show)$("dlg").showModal();$("dlg").scrollTop=0}
function head(){const bests=ROWS.filter(r=>r.best);let bp=0,bn=0,bheld=0,bof=0;
 for(const r of bests){const m=measure(r,null,1);if(r.split!=null&&m.newN){bp+=m.newP;bn+=m.newN;bof++;if(m.newP>0)bheld++}}
 const bestLine=`<b>BEST for every coin-timeframe:</b> ${bests.length.toLocaleString()} strategies, one for each coin on each timeframe it trades - chosen on its OLDER days only - the most of the skills' checks passed there, then the most money a trade there (pick "BEST for each coin-timeframe" under Held up). On those unseen days the BEST picks made <b class="${bp>0?"pos":"neg"}">${money(bp)}</b> over ${bn.toLocaleString()} trades (${bn?money(bp/bn):"-"} a trade); ${bheld.toLocaleString()} of ${bof.toLocaleString()} made money. `;const v2=ROWS.filter(r=>r.src==="v2");let p=0,n=0,held=0,heldOf=0;
 for(const r of v2){const m=measure(r,null,1);if(m.newN){p+=m.newP;n+=m.newN;heldOf++;if(m.newP>0)held++}}
 const bars=v2.filter(r=>r.bar!=null);const both=ROWS.filter(r=>r.both===1).length/2;
 const fw=ROWS.filter(r=>r.fwd);let fp=0,ft=0,fr=0,fpos=0;const fc=new Set();
 const fseen=new Set();let fdist=0;
 for(const r of fw){const m=measure(r,null,1);const d=[r.coin,r.tf,r.strategy.split(" ").slice(-1)[0],m.trades,(m.profit||0).toFixed(2)].join("|");
  if(fseen.has(d))continue;fseen.add(d);fdist++;fp+=m.profit||0;ft+=m.trades;fr+=r.bar||0;if(m.profit>0)fpos++;fc.add(r.coin)}
 const fwdLine=fw.length?`<b>FORWARD-TESTED - the strategies that held up:</b> ${fw.length.toLocaleString()} v3 rows (${fdist} distinct trade lists - filters that change nothing counted once below) on ${fc.size} coins that were profitable on 2025's unseen days AND whose setting 2026's own older days chose again (both known before 2026's unseen days began). On 2026's unseen days they made <b class="${fp>0?"pos":"neg"}">${money(fp)}</b> over ${ft.toLocaleString()} trades (${ft?money(fp/ft):"-"} a trade), ${fpos} of ${fdist} in profit, against ${money(fr)} for their random runs' medians - the one way of choosing in this research that beat random entries forward (pick FORWARD-TESTED under Held up). `:"";
 $("head").innerHTML=fwdLine+bestLine+`<b>Read this first.</b> Choosing works only if a strategy picked on older days keeps making money on days it was not picked on. `
  +`Over the newest 15 days the ${v2.length.toLocaleString()} v2 picks made <b class="${p>0?"pos":"neg"}">${money(p)}</b> over ${n.toLocaleString()} trades (${n?money(p/n):"-"} a trade); ${held.toLocaleString()} of ${heldOf.toLocaleString()} made money. `
  +`An average strategy of the same coin-timeframes made ${bars.length?money(bars.reduce((s,r)=>s+r.bar,0)/bars.length):"-"} a trade on the stored backtest's newest 15 days (averaged over the picks' coin-timeframes). `
  +`On ${D.v2_rows_read.toLocaleString()} rows, 8 ways of choosing were tried before this page was built and every one lost money on the newest 15 days; this page ranks by the least bad (the trading cost against the target, lowest first). `
  +`v3: <b>${both.toLocaleString()}</b> coin x idea groups were profitable in BOTH years.`
  +skillLine(ROWS.filter(r=>r.src==="skill"&&!TA(r)),D.skill,"The backtesting-trading-strategies skill","its own 8 strategies x 3 settings x 2 stops")
  +skillLine(ROWS.filter(r=>r.src==="skill"&&TA(r)),D.skill_ta,"The technical-analysis and backtesting-frameworks skills","their own setups - Wyckoff spring and upthrust, RSI divergence with a structure break, market structure break, VWAP band fade, filtered average cross, pullback to the average (technical-analysis, target 2x the stop) and the framework's momentum rule - x 3 settings x 2 stops")}
// a skill strategy's label names the technical-analysis or backtesting-frameworks skill (skill_ta.py)
function TA(r){return /^(technical-analysis|backtesting-frameworks): /.test(r.strategy)}
function skillLine(sk,meta,who,what){if(!sk.length||!meta)return "";let p=0,n=0,held=0,of=0;
 for(const r of sk){const m=measure(r,null,1);if(m.newN){p+=m.newP;n+=m.newN;of++;if(m.newP>0)held++}}
 const bars=sk.filter(r=>r.bar!=null);
 return ` <b>${who}</b> (${what}, ${meta.combos} a coin-timeframe, chosen on the older 70% of the candles - the backtesting-frameworks walk-forward): ${sk.length.toLocaleString()} picks made <b class="${p>0?"pos":"neg"}">${money(p)}</b> over ${n.toLocaleString()} trades (${n?money(p/n):"-"} a trade) on the newest 30% they were not chosen on; ${held.toLocaleString()} of ${of.toLocaleString()} made money; an average setting of the same coin-timeframes made ${bars.length?money(bars.reduce((s,r)=>s+r.bar,0)/bars.length):"-"} a trade there.`}
function drawProv(){$("prov").innerHTML=`<b>${D.v2_rows_read.toLocaleString()}</b> Backtest v2 strategies read on <b>${D.v2_pairs.toLocaleString()}</b> coin-timeframes (every coin x 15m, 30m, 1h, 4h, 1d), up to ${D.rule.per_pair} picked on each, chosen on the OLDER 15 days of each 30-day backtest (at least ${Object.entries(D.rule.min_old).map(([t,n])=>`${n} trades on ${t}`).join(", ")}), ${D.v2_empty.toLocaleString()} coin-timeframes had no strategy that made money there; every v2 pick re-measured on GitHub with every trade kept, ${D.collected_s?fmtWhen(D.collected_s*1000):"-"}. ${D.skill?`Plus the backtesting-trading-strategies skill run on ${D.skill.pairs.toLocaleString()} coin-timeframes (${D.skill.combos} settings each: 30 days of 15m, 60 of 30m, 90 of 1h, 180 of 4h, two years of 1d; the coin's fee both ways and its usual gap). `:""}${D.skill_ta?`Plus the technical-analysis and backtesting-frameworks skills' own setups run the same way on ${D.skill_ta.pairs.toLocaleString()} coin-timeframes (${D.skill_ta.combos} settings each). `:""}Plus every Backtest v3 per-coin strategy whose setting could be chosen (${D.v3_names.join(", ")}: 1h, 4h, 1d, 63 combinations a coin, 90 unseen days each). v2: <b>${usd(state.base)}</b> margin at 20x = ${usd(state.base*20)} of coin a trade; v3: ${usd(state.base)} risked to the stop. Every trade pays both fees, its minutes' order book where one was recorded, and funding. Picked ${fmtWhen(D.made_s*1000)}.`}
function wire(){
 $("dlg-close").onclick=()=>$("dlg").close();$("f-base").value=D.base;
 for(const s of [...new Set(ROWS.map(r=>r.src))])$("f-src").insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`);
 for(const [el,key] of [["f-wr","wr"],["f-ratio","ratio"],["f-pr","pr"],["f-nt","nt"],["f-cn","cn"],["f-gm","gm"],["f-dd","dd"],["f-tp","tp"],["f-sl","sl"]])$(el).addEventListener("input",e=>{state.f[key]=num(e.target.value);state.page=0;render()});
 for(const [el,key] of [["f-src","src"],["f-tf","tf"],["f-held","held"]])$(el).addEventListener("change",e=>{state[key]=e.target.value;state.page=0;render()});
 $("f-base").addEventListener("input",e=>{const v=num(e.target.value);state.base=v&&v>0?v:D.base;drawProv();render()});
 $("f-days").addEventListener("input",e=>{const v=num(e.target.value);state.days=v&&v>0?Math.floor(v):null;state.page=0;render()});
 $("f-coin").addEventListener("input",e=>{state.coin=e.target.value.trim();state.page=0;render()});
 $("f-id").addEventListener("input",e=>{state.id=e.target.value.trim();state.page=0;render();const id=idKey();
  const hit=ROWS.find(r=>r.id===id);if(hit){if(state.opened!==id){state.opened=id;open(hit.i)}}else state.opened=""});
 $("clear").onclick=()=>{state.f={};state.days=null;state.coin="";state.id="";state.opened="";state.src="";state.tf="";state.held="";state.page=0;
  for(const el of ["f-wr","f-ratio","f-pr","f-nt","f-cn","f-gm","f-dd","f-tp","f-sl","f-days","f-coin","f-id","f-src","f-tf","f-held"])$(el).value="";render()};
 $("p-prev").onclick=()=>{state.page--;render()};$("p-next").onclick=()=>{state.page++;render()};
 $("legend").textContent="Month columns are calendar months of your own time zone; only months a shown row traded in are columns. SL % and TP % show the tightest to the widest stop and target among the row's trades, and the max boxes cut on the widest. Win size ÷ loss size is the average win against the average loss, after every fee. Last N days counts back from each row's own window end (v2 rows end in Nov 2026, v3 rows at the end of their year's unseen days). The 7 checks are the tests the technical-analysis, backtesting-trading-strategies and backtesting-frameworks skills ask of a strategy; every trade already pays both fees and its order book (the eighth check, always passed). Sharpe and Sortino are a year's worth, from the trades' own returns; the Monte Carlo draws are over the whole window. A v2 row marked 'lost on the older days' is a filler: shown so every coin and timeframe has strategies, though none of its rows made money where it was chosen.";
 const notes=[];
 if(D.missing.length)notes.push(`<details><summary>v2 picks with no trade list (left out, named): ${D.missing.length}</summary><ul>${D.missing.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 if(D.failed.length)notes.push(`<details><summary>Coin-timeframes that failed on GitHub: ${D.failed.length}</summary><ul>${D.failed.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 if(D.skill&&D.skill.failed.length)notes.push(`<details><summary>Skill run: coin-timeframes the exchange has no candles for: ${D.skill.failed.length}</summary><ul>${D.skill.failed.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 if(D.skill&&D.skill.skipped.length)notes.push(`<details><summary>Skill run: too few candles (under 60): ${D.skill.skipped.length}</summary><ul>${D.skill.skipped.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 if(D.skill&&D.skill.no_trade&&D.skill.no_trade.length)notes.push(`<details><summary>Skill run: coin-timeframes where no strategy could trade: ${D.skill.no_trade.length}</summary><ul>${D.skill.no_trade.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 if(D.skill&&D.skill.not_reached.length)notes.push(`<details><summary>Skill run: coins no machine reached: ${D.skill.not_reached.length}</summary><ul>${D.skill.not_reached.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 for(const [k,who] of [["skill","Skill run"],["skill_ta","Technical-analysis + frameworks run"]]){const m=D[k];if(!m||k==="skill")continue;
  for(const [list,what] of [[m.failed,"coin-timeframes that failed or have no candles"],[m.skipped,"too few candles"],[m.no_trade||[],"coin-timeframes where no strategy could trade"],[m.not_reached,"coins no machine reached"]])
   if(list.length)notes.push(`<details><summary>${who}: ${what}: ${list.length}</summary><ul>${list.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`)}
 if(D.not_reached.length)notes.push(`<details><summary>Coins no machine reached: ${D.not_reached.length}</summary><ul>${D.not_reached.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`);
 $("notes").innerHTML=notes.length?notes.join(""):"Every pick came back with its trades.";
 drawProv();head();render()}
async function inflate(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const s=new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(s).text())}
inflate(Z).then(d=>{D=d;ROWS=rowsOf(D);for(const r of ROWS)r.mc=monteCarlo(r.t);markBest();state.base=D.base;wire()}).catch(e=>{$("prov").textContent="The page's data could not be opened: "+e})
</script></body></html>
